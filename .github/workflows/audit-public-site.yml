name: Daily SMAT Designs production link audit

on:
  schedule:
    - cron: "17 15 * * *" # 08:17 Phoenix, daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smatdesigns-daily-public-links
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require isolated GitHub standard runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          test "$(uname -s)" = "Linux"
      - uses: actions/checkout@v4
      - name: Test live link audit rules
        run: python3 -m unittest discover -s scripts -p 'test_live_links.py'
      - name: Audit real production links and media
        run: python3 scripts/audit_live_links.py --base https://smatdesigns.com
