name: Verify public business website
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/check_site.py'
      - 'scripts/audit_live_links.py'
      - 'scripts/test_live_links.py'
      - 'scripts/check_live_site.sh'
      - 'scripts/build_share_image.py'
      - 'images/**'
      - '.github/workflows/verify-website.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/check_site.py'
      - 'scripts/audit_live_links.py'
      - 'scripts/test_live_links.py'
      - 'scripts/check_live_site.sh'
      - 'scripts/build_share_image.py'
      - 'images/**'
      - '.github/workflows/verify-website.yml'
  workflow_dispatch:
jobs:
  static-site-contract:
    runs-on: [self-hosted, macOS, ARM64, smat-m1]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify business and software pages
        run: python3 scripts/check_site.py
      - name: Test production link audit classification
        run: python3 -m unittest discover -s scripts -p 'test_live_links.py'
