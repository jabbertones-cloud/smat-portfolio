name: Verify public business website
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/check_site.py'
      - 'scripts/audit_live_links.py'
      - 'scripts/test_live_links.py'
      - 'scripts/check_live_site.sh'
      - 'scripts/build_share_image.py'
      - 'images/**'
      - '.github/workflows/*.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/check_site.py'
      - 'scripts/audit_live_links.py'
      - 'scripts/test_live_links.py'
      - 'scripts/check_live_site.sh'
      - 'scripts/build_share_image.py'
      - 'images/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:
jobs:
  static-site-contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require isolated GitHub standard runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          test "$(uname -s)" = "Linux"
      - uses: actions/checkout@v4
      - name: Enforce free public-runner policy
        run: python3 -m unittest discover -s scripts -p 'test_ci_public_runner_policy.py'
      - name: Verify business and software pages
        run: python3 scripts/check_site.py
      - name: Test production link audit classification
        run: python3 -m unittest discover -s scripts -p 'test_live_links.py'
