name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: smatdesigns-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Require isolated GitHub standard runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          test "$(uname -s)" = "Linux"
      - uses: actions/checkout@v4
      - name: Enforce free public-runner policy
        run: python3 -m unittest discover -s scripts -p 'test_ci_public_runner_policy.py'
      - name: Check website before deployment
        run: python3 scripts/check_site.py
      - name: Deploy with supported Cloudflare Wrangler action
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 793e209ea35f2e064b4b49b168a26c22
          command: pages deploy . --project-name=smatdesigns --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published production website
        run: bash scripts/check_live_site.sh https://smatdesigns.com
      - name: Audit production sitemap links, metadata and media
        run: python3 scripts/audit_live_links.py --base https://smatdesigns.com
